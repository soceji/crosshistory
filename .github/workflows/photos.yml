name: 위키백과 사진 받기
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/photo_queries.json'
      - 'tools/fetch_photos.py'
      - '.github/workflows/photos.yml'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python tools/fetch_photos.py
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/photos.json tools/photo_log.txt tools/photo_candidates.json
          git diff --cached --quiet || (git commit -m "Update Wikipedia photos" && git pull --rebase origin main && git push origin HEAD:main)
