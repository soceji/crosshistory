<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>역사의 갈림길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 지도가 화면의 주인공, 오른쪽에 국정 패널, 위에 연표 막대. 밤의 지도첩 — 먹빛 바다, 한지빛 글자, 금빛 영토, 붉은 낙관 */
:root{
  --ink:#0d1318; --ocean:#13222c; --panel:#121a20; --panel2:#18222a; --line:#28353f; --line2:#34434e;
  --fg:#ebe5d6; --fg2:#c3bcac; --muted:#8a949b; --gold:#d6a94f; --gold2:#f0cf86; --seal:#c4452f; --seal2:#e0664f;
  --good:#79b48a; --warn:#d9a441; --bad:#d5604e;
  --f-display:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--f-display)}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ── 앱 골격 ── */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(#111a20,#0e161b);flex-wrap:wrap;min-width:0}
#main{display:grid;grid-template-columns:1fr 410px;min-height:0}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--ocean);overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#map.drag{cursor:grabbing}
#side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#ticker{border-top:1px solid var(--line);background:#0b1115;height:30px;overflow:hidden;white-space:nowrap;font-size:12.5px;display:flex;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:22px;color:var(--fg2)}
#ticker .tk{display:inline-flex;gap:6px;align-items:center}
#ticker .tk b{font-family:var(--f-display);color:var(--seal2);font-weight:700}
#ticker .tk .y{font-family:var(--f-mono);color:var(--muted)}

/* 국가 칩 */
.realm{display:flex;align-items:center;gap:10px;min-width:0}
.realm .flag{width:30px;height:30px;border-radius:4px;border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);flex:none}
.realm .nm{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.realm .gv{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* 날짜와 속도 */
.clock{display:flex;align-items:center;gap:10px}
.date{font-family:var(--f-display);font-weight:700;font-size:19px;min-width:168px;text-align:center;letter-spacing:.01em}
.speeds{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.speeds button{padding:4px 8px;font-family:var(--f-mono);font-size:12px;color:var(--fg2);border-right:1px solid var(--line)}
.speeds button:last-child{border-right:0}
.speeds button.on{background:var(--gold);color:#1a1408;font-weight:500}
.speeds button.pause.on{background:var(--seal);color:#fff}
.ff{padding:4px 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;color:var(--fg2)}
.ff:hover,.speeds button:hover{background:rgba(255,255,255,.06)}

.stats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.pill{display:flex;flex-direction:column;padding:2px 9px;border-left:1px solid var(--line);min-width:0}
.pill .k{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.pill .v{font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .v small{font-size:11px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.menu-btn{padding:6px 10px;border:1px solid var(--line2);border-radius:6px;font-size:12.5px}

/* 지도 위 컨트롤 */
.mapctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.mapctl button{background:rgba(13,19,24,.85);border:1px solid var(--line2);border-radius:5px;padding:4px 10px;font-size:12px;color:var(--fg2);backdrop-filter:blur(4px)}
.mapctl button.on{color:var(--gold2);border-color:var(--gold)}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoomctl button{width:30px;height:30px;background:rgba(13,19,24,.85);border:1px solid var(--line2);border-radius:5px;font-size:16px}
.legend{position:absolute;right:12px;bottom:12px;background:rgba(13,19,24,.85);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:11.5px;color:var(--fg2);z-index:2;max-width:260px}
.res-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.res-row .g{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:11px;color:#0d1318;flex:none}
.res-row .g.off{background:#283036!important;border:1px solid currentColor}
.legend .ramp{height:8px;border-radius:2px;margin:4px 0 2px;width:180px}
.legend .ends{display:flex;justify-content:space-between;width:180px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

/* 지방 카드 */
#pcard{position:absolute;left:12px;bottom:12px;width:300px;max-width:calc(100% - 24px);background:rgba(16,23,29,.96);border:1px solid var(--line2);border-radius:8px;padding:12px 14px;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#pcard h3{margin:0;font-family:var(--f-display);font-size:17px;text-wrap:balance}
#pcard .own{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2);margin:2px 0 8px}
#pcard .own i{width:10px;height:10px;border-radius:2px;display:inline-block}
#pcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 10px;font-size:12.5px}
#pcard dt{color:var(--muted)} #pcard dd{margin:0;font-family:var(--f-mono);text-align:right}
#pcard .acts{display:flex;flex-direction:column;gap:6px}
#pcard .x{position:absolute;right:8px;top:6px;color:var(--muted);font-size:18px;padding:2px 6px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);font-size:13px;text-align:left}
.btn:hover:not(:disabled){border-color:var(--gold);background:#1d2932}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{color:var(--muted);font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.btn.war{border-color:#5a2c26}.btn.war:hover:not(:disabled){border-color:var(--seal2);background:#2a1916}
.btn.gold{background:var(--gold);color:#1b1407;border-color:var(--gold);font-weight:600;justify-content:center}
.btn.gold:hover:not(:disabled){background:var(--gold2)}

/* 패널 탭 */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{flex:1;padding:10px 6px 9px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--gold)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--seal2);margin-left:4px;vertical-align:middle}
.pane{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;min-height:0}
.pane h4{font-family:var(--f-display);font-size:14px;margin:18px 0 8px;color:var(--fg);letter-spacing:.02em;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.pane h4>span:first-child{white-space:nowrap}
.pane h4:first-child{margin-top:0}
.pane h4 .s{font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-weight:400}
.sub{font-size:12px;color:var(--muted)}

/* 지도자 카드 */
.ruler{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.seal{width:44px;height:44px;flex:none;border-radius:4px;background:var(--seal);color:#fbeee6;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:24px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 0 0 4px var(--seal)}
.ruler .nm{font-family:var(--f-display);font-weight:700;font-size:16px}
.ruler .st{display:flex;gap:10px;font-size:12px;color:var(--fg2)}
.ruler .st b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}

/* 통계 표 (실제 역사 비교) */
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th{font-weight:500;color:var(--muted);text-align:right;font-size:11px;letter-spacing:.04em;padding:0 0 4px}
.cmp th:first-child{text-align:left}
.cmp td{padding:5px 0;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cmp td:first-child{text-align:left;font-family:var(--f-body);color:var(--fg2)}
.cmp td.r{color:var(--muted)}
.factline{font-size:12.5px;color:var(--fg2);border-left:2px solid var(--gold);padding:4px 0 4px 10px;margin:10px 0}

.row{display:flex;gap:10px;align-items:center}
.slider{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.slider input{width:100%;accent-color:var(--gold)}
.slider .row{justify-content:space-between;font-size:12.5px}

/* 차트 */
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .lg{display:flex;gap:14px;font-size:11.5px;color:var(--fg2);margin-bottom:4px;flex-wrap:wrap}
.chart .lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.chart .lg i.d{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}
.tip{position:absolute;pointer-events:none;background:#0b1115;border:1px solid var(--line2);border-radius:5px;padding:5px 8px;font-size:11.5px;white-space:nowrap;z-index:5}
.tip b{font-family:var(--f-mono);font-weight:500}

/* 기술 */
.focus{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border:1px solid var(--line2);border-radius:999px;font-size:12px;color:var(--fg2)}
.chip.on{border-color:var(--gold);color:var(--gold2);background:rgba(214,169,79,.08)}
.cur{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.bar{height:6px;background:#0b1115;border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:3px}
.treewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;max-height:56vh;background:#0f171c;position:relative}
.tree{position:relative}
.tree svg{position:absolute;left:0;top:0;pointer-events:none}
.tn{position:absolute;width:128px;height:34px;border-radius:5px;border:1px solid var(--line2);background:#141e25;font-size:11.5px;line-height:1.15;padding:3px 6px;text-align:left;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.tn small{font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.tn.known{background:#2a2617;border-color:#5d4c22;color:var(--gold2)}
.tn.avail{border-color:var(--gold);color:var(--fg)}
.tn.avail:hover{background:#1f2b33}
.tn.locked{color:#66717a}
.tn.cur{box-shadow:0 0 0 2px var(--gold2);background:linear-gradient(90deg,rgba(214,169,79,.35) var(--p),#141e25 var(--p))}
.eh{position:absolute;top:6px;font-family:var(--f-display);font-size:12px;color:var(--muted);letter-spacing:.08em}
.ch{position:absolute;left:6px;font-family:var(--f-display);font-size:16px;color:#3c4a54}

/* 정책 */
.pol{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:var(--panel2)}
.pol.on{border-color:var(--gold);background:#211e15}
.pol .t{font-weight:600;font-size:13px}
.pol .t .kr{font-size:10.5px;color:var(--seal2);border:1px solid #6b2e24;border-radius:3px;padding:0 4px;margin-left:6px;font-weight:500}
.pol .d{grid-column:1;font-size:12px;color:var(--muted)}
.pol .fx{grid-column:1;font-size:11.5px;font-family:var(--f-mono);color:var(--fg2)}
.pol button{grid-column:2;grid-row:1/4;align-self:center;padding:5px 10px;border:1px solid var(--line2);border-radius:5px;font-size:12px}
.pol.on button{border-color:var(--gold);color:var(--gold2)}
.slots{display:flex;gap:4px}
.slots i{width:18px;height:6px;border-radius:2px;background:var(--line2)}
.slots i.f{background:var(--gold)}
select{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;max-width:100%}

/* 외교 */
.war{border:1px solid #4e2a24;background:#1c1513;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.war .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.war .h b{font-family:var(--f-display)}
.war .meter{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 4px;background:#0b1115}
.war .meter i{display:block;height:100%}
.nb{display:grid;grid-template-columns:12px 1fr auto auto;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.nb i{width:10px;height:10px;border-radius:2px}
.nb .r{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.nb button{padding:3px 8px;border:1px solid #5a2c26;border-radius:5px;font-size:11.5px;color:var(--seal2)}
.nb button:disabled{opacity:.4}

/* 인물 */
.fig{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.fig .seal{grid-row:1/3}
.fig.dim .seal{background:#3a3f44;box-shadow:none;color:#9aa3a9}
.fig .n{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fig .n small{font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.fig .x{font-size:12.5px;color:var(--fg2)}
.badge{font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--fg2);font-family:var(--f-body)}
.badge.act{border-color:var(--gold);color:var(--gold2)}
.badge.dead{color:var(--muted)}

/* 연대기 */
.chron{list-style:none;margin:0;padding:0}
.chron li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.chron .g{width:28px;height:28px;border-radius:3px;background:#2a1a17;color:var(--seal2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px;border:1px solid #4e2a24}
.chron .y{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chron .t{font-family:var(--f-display);font-weight:700;font-size:14px}
.chron .x{font-size:12.5px;color:var(--fg2);margin-top:2px}

/* ── 사건 모달 (EU 풍) ── */
.ovl{position:fixed;inset:0;background:rgba(5,8,10,.62);display:grid;place-items:center;z-index:20;padding:16px;backdrop-filter:blur(2px)}
.evt{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:#141b20;border:1px solid #4b3d22;border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 4px #10161a,inset 0 0 0 5px #3a3020;animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.evt{animation:none}}
.evt .hd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:18px 22px 14px;border-bottom:1px solid #2e3a42;background:linear-gradient(180deg,#1c2329,#141b20)}
.evt .hd .seal{width:58px;height:58px;font-size:32px}
.evt .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.evt h2{font-family:var(--f-display);font-weight:900;font-size:24px;margin:2px 0 0;line-height:1.25;text-wrap:balance}
.evt .who{font-size:12.5px;color:var(--gold2);margin-top:2px}
.evt .body{padding:16px 22px 6px;font-size:14.5px;line-height:1.75;color:var(--fg);max-width:65ch}
.evt .opts{display:flex;flex-direction:column;gap:8px;padding:12px 22px 20px}
.opt{display:block;text-align:left;padding:10px 14px;border:1px solid #4b3d22;border-radius:5px;background:#1b1f1e}
.opt:hover{background:#262418;border-color:var(--gold)}
.opt .l{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.opt .l .h{font-size:10.5px;font-weight:500;color:#1b1407;background:var(--gold);border-radius:3px;padding:0 5px}
.opt .tp{font-size:12px;color:var(--fg2);margin-top:2px}
.opt .dv{font-size:11.5px;color:var(--seal2)}

/* ── 시작 화면 ── */
#start{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);background:var(--ink)}
#start .l{padding:36px max(24px,env(safe-area-inset-left,0px)) 28px 40px;overflow:auto;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line)}
#start .brand{display:flex;gap:16px;align-items:center}
#start .brand .seal{width:64px;height:64px;font-size:30px;line-height:1}
#start h1{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.1;margin:0;letter-spacing:-.01em}
#start .lead{color:var(--fg2);font-size:14.5px;max-width:58ch;margin:0}
.eras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.era{padding:10px 12px;border:1px solid var(--line2);border-radius:7px;text-align:left;background:var(--panel2)}
.era .y{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.era .n{font-family:var(--f-display);font-weight:700;font-size:16px}
.era.on{border-color:var(--gold);background:#211e15}
.era.on .n{color:var(--gold2)}
.eradesc{font-size:13px;color:var(--fg2);border-left:2px solid var(--seal);padding:2px 0 2px 12px;margin:0}
.clist{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:260px;padding-right:4px}
.ci{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid transparent;border-radius:6px;text-align:left}
.ci:hover{background:var(--panel2)}
.ci.on{border-color:var(--gold);background:#211e15}
.ci i{width:12px;height:12px;border-radius:2px}
.ci .p{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ci .kr{font-size:10.5px;color:var(--seal2);margin-left:6px}
.cdesc{font-size:12.5px;color:var(--fg2);min-height:2.5em;margin:0}
#start .r{position:relative;background:var(--ocean);min-width:0}
#start .r canvas{position:absolute;inset:0;width:100%;height:100%}
#start .r .cap{position:absolute;left:18px;bottom:16px;right:18px;font-size:12px;color:var(--muted)}
.startbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.startbar .btn{flex:1;min-width:140px;justify-content:center}

/* 결말 */
.final{width:min(760px,100%);max-height:calc(100% - 20px);overflow:auto;background:#141b20;border:1px solid #4b3d22;border-radius:6px;padding:28px 30px}
.final h2{font-family:var(--f-display);font-weight:900;font-size:30px;margin:4px 0 10px;text-wrap:balance}
.final .big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.final .big>div{border-top:2px solid var(--gold);padding-top:8px}
.final .big .v{font-family:var(--f-mono);font-size:22px}
.final .big .k{font-size:12px;color:var(--muted)}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;margin:12px 0}

.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1d262d;border:1px solid var(--line2);padding:8px 14px;border-radius:6px;font-size:13px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu{position:absolute;right:16px;top:52px;background:#141b20;border:1px solid var(--line2);border-radius:8px;padding:6px;z-index:25;display:flex;flex-direction:column;min-width:180px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{text-align:left;padding:8px 10px;border-radius:5px;font-size:13px}
.menu button:hover{background:var(--panel2)}

/* ── 좁은 화면 ── */
@media (max-width:1500px){ .stats .pill .k{font-size:10px} .pill .v{font-size:12.5px} .ff{padding:4px 8px} }
@media (max-width:980px){
  #main{grid-template-columns:1fr;grid-template-rows:minmax(260px,52%) 1fr}
  #side{border-left:0;border-top:1px solid var(--line)}
  .stats{margin-left:0;width:100%}
  .pill{min-width:0;flex:1 1 30%}
  .date{min-width:0;font-size:17px}
  #start{display:flex;flex-direction:column;overflow:auto}
  #start .l{padding:20px 16px 24px;border-right:0;overflow:visible;flex:none}
  #start .r{order:-1;flex:none;height:210px;border-bottom:1px solid var(--line)}
  #start .r .cap{display:none}
  .eras{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clist{max-height:220px}
}
@media (max-width:560px){
  #top{gap:6px 8px;padding-top:6px;padding-bottom:6px}
  .realm{flex:1}
  .realm .flag{width:24px;height:24px}
  .clock{width:100%;gap:6px;order:3}
  .date{font-size:14.5px;min-width:0;text-align:left;flex:none}
  .speeds{overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .speeds button{padding:4px 6px;flex:none}
  .ff{padding:4px 7px;white-space:nowrap;font-size:11.5px}
  .stats{order:4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 0}
  .pill{padding:1px 6px}
  .pill .v{font-size:12px;overflow:hidden;text-overflow:ellipsis}
  .pill .v small{display:none}
  .menu-btn{padding:4px 8px}
  #main{grid-template-rows:minmax(240px,48%) 1fr}
  .realm .nm{font-size:15px;max-width:150px}
  #start h1{font-size:30px}
  .final .big{grid-template-columns:1fr 1fr}
  .speeds button{padding:4px 6px}
  .evt h2{font-size:20px}
  .evt .hd,.evt .body,.evt .opts{padding-left:16px;padding-right:16px}
}

add(220,1,1,'HAN','戰','한의 멸망과 삼국시대','조비가 헌제의 선양을 받아 위를 세웠다. 촉의 유비와 오의 손권이 각각 황제를 칭한다.',

add(316,1,1,'JINDYN','戰','영가의 난과 5호16국','흉노·선비 등 다섯 유목 민족이 화북을 차지했다. 진 왕실은 강남으로 달아난다.',

add(371,10,1,'BAEKJE','戰','근초고왕의 평양성 공격','백제 3만 군이 평양성을 공격했다. 고국원왕이 화살에 맞아 전사한다.',

add(395,1,17,'ROMEMP','政','로마 제국의 동서 분열','테오도시우스 황제가 죽으면서 두 아들에게 제국을 나누어 주었다.',

add(396,1,1,'GOGURYEO','戰','광개토대왕의 남정','영락 6년, 대왕이 친히 수군을 이끌고 백제의 58성을 함락했다. 아신왕이 무릎을 꿇었다.',

add(400,1,1,'GOGURYEO','戰','신라 구원 — 왜를 물리치다','신라의 요청을 받은 고구려 5만 군이 낙동강까지 내려가 왜와 가야 연합군을 쳤다.',

add(410,1,1,'GOGURYEO','戰','동부여 정벌','광개토대왕이 동부여를 정벌해 64성을 얻었다. 494년 부여는 완전히 고구려에 흡수된다.',

add(427,1,1,'GOGURYEO','政','장수왕의 평양 천도','국내성에서 평양으로 도읍을 옮겨 남진의 의지를 드러냈다.',

add(476,9,4,'WROME','戰','서로마 제국의 멸망','게르만 용병대장 오도아케르가 마지막 황제 로물루스 아우구스툴루스를 폐위했다.',

add(612,3,1,'SUI','戰','살수대첩','수 양제의 113만 대군이 고구려를 침공했다. 을지문덕이 별동대 30만을 살수로 끌어들였다.',

  pAlt:{tag:'GOGURYEO',t:'살수대첩',x:'수 양제의 113만 대군이 요하를 건넜다. 을지문덕은 적장 우중문에게 시를 보낸다. "신기한 계책은 천문을 꿰뚫고, 묘한 셈은 지리를 다했도다. 싸워 이긴 공이 이미 높으니, 만족함을 알고 그치기를 바라노라."',

add(632,6,8,null,'政','정통 칼리프 시대','예언자 무함마드가 죽은 뒤 아부 바크르가 칼리프가 되었다. 아랍 군대가 사막을 나선다.',

add(648,1,1,'SILLA','外','나당 동맹','김춘추가 당 태종을 만나 동맹을 맺었다. 백제와 고구려를 멸한 뒤 대동강 이남은 신라가 갖기로 한다.',

add(660,7,9,'TANG','戰','백제의 멸망','소정방의 당군 13만과 김유신의 신라군 5만이 백제를 협공했다. 계백의 결사대가 황산벌에서 쓰러지고, 사비성이 함락되었다.',

add(668,9,21,'TANG','戰','고구려의 멸망','연개소문이 죽고 아들들이 다투는 사이 나당 연합군이 평양성을 무너뜨렸다. 705년의 고구려가 끝났다.',

add(670,3,1,'SILLA','戰','나당 전쟁','당이 웅진도독부와 안동도호부를 두어 한반도 전체를 삼키려 하자 신라가 칼을 돌렸다. 매소성과 기벌포에서 당군을 격파한다.',

add(698,1,1,null,'政','발해의 건국','고구려 유민 대조영이 천문령에서 당군을 물리치고 동모산에 나라를 세웠다. 해동성국 발해.',

add(751,7,1,'TANG','戰','탈라스 전투','고구려 유민 출신 장수 고선지가 이끄는 당군이 아바스 군에 패했다. 포로가 된 제지공이 사마르칸트에 종이를 전한다.',

add(828,1,1,'SILLA','商','장보고의 청해진','당에서 돌아온 장보고가 완도에 청해진을 세웠다. 신라·당·일본을 잇는 바닷길을 장악한다.',

add(843,8,10,'FRANKEMP','政','베르됭 조약','루트비히 경건왕의 세 아들이 제국을 나누었다. 오늘날 프랑스와 독일의 원형이 생긴다.',

add(1368,1,23,null,'政','명(明)의 건국','홍건적 출신의 주원장이 응천부에서 황제가 되었다. 원은 몽골 초원으로 쫓겨난다.',

add(1370,1,1,null,'戰','티무르의 제국','절름발이 티무르가 사마르칸트에서 일어나 차가타이 칸국을 장악했다.',

add(1377,7,1,'GORYEO','學','직지심체요절과 화통도감','청주 흥덕사에서 금속활자로 직지를 찍었다. 같은 해 최무선의 건의로 화통도감이 설치되었다.',

add(1380,8,1,'GORYEO','兵','진포 대첩','최무선이 만든 화포로 왜선 500척을 불태웠다. 같은 해 이성계는 황산에서 왜구를 섬멸한다.',

add(1386,1,1,'TIMURID','戰','티무르의 서정','티무르가 일 칸국의 잔존 세력과 금장 칸국을 짓밟았다.',[H('서정','일 칸국 정복, 금장 칸국 약화',E=>{E.conquer('TIMURID','ILKHANATE',{share:1,boost:2});E.mod('GOLDENHORDE',{army:-.4,stab:-2});})],{maj:1});
add(1388,5,22,'GORYEO','政','위화도 회군','요동 정벌군을 이끌던 이성계가 압록강 위화도에서 말머리를 돌렸다. "작은 나라가 큰 나라를 거스르는 것은 옳지 않다."',
 [H('회군을 받아들인다 (역사)','이성계가 권력 장악. 4년 뒤 조선 건국',E=>{E.flag('GORYEO','wihwado');E.mod('GORYEO',{stab:-1});}),
  O('요동 정벌을 강행한다','명과 전쟁, 군사력 +20% (역사 개변 +14)',E=>{E.war('GORYEO','MING');E.mod('GORYEO',{army:.2});},false,14),

add(1392,7,17,'GORYEO','政','조선의 건국','이성계가 공양왕의 선양을 받아 왕위에 올랐다. 이듬해 국호를 조선으로 정한다.',
 [H('역성혁명 (역사)','고려 → 조선, 정책 「과전법」 「유교 국가」',E=>{E.retag('GORYEO','JOSEON','조선',{gov:'central',col:'#2f6f9a'});E.pol('JOSEON','gwajeon');E.pol('JOSEON','confu');E.mod('JOSEON',{stab:1});}),
  O('고려 왕조를 지킨다','정몽주와 함께 이성계 일파 제거, 안정도 -1 (역사 개변 +14)',E=>E.mod('GORYEO',{stab:-1}),false,14)],{maj:1,cond:E=>E.has('GORYEO')&&E.hf('GORYEO','wihwado')});
add(1394,10,1,'JOSEON','政','한양 천도','정도전의 설계로 한양에 경복궁을 짓고 도읍을 옮겼다.',[H('한양으로','수도 이전, 안정도 +0.5',E=>{E.capital('JOSEON',[127,37.57]);E.mod('JOSEON',{stab:.5});}),O('개경에 머문다','국고 +0.3년치',E=>E.mod('JOSEON',{gold:.3}),false,3)]);
add(1402,7,20,'TIMURID','戰','앙카라 전투','티무르가 오스만 술탄 바예지드 1세를 사로잡았다. 오스만은 10년간 내전에 빠진다.',[H('격파','오스만 안정도 -3',E=>{E.mod('OTTOMAN',{stab:-3,army:-.5});})],{maj:1,cond:E=>E.has('TIMURID')&&E.has('OTTOMAN')});
add(1405,7,11,'MING','通','정화의 대항해','영락제의 명으로 정화가 길이 120m가 넘는 보선 60여 척을 이끌고 남해로 나섰다. 일곱 차례 항해 끝에 아프리카 동해안에 이른다.',

add(1420,3,1,'JOSEON','學','집현전','세종이 집현전을 확대해 젊은 학자들을 모았다.',[H('학자를 모은다','연구 +20% (30년)',E=>E.tmod('JOSEON','res',.2,30,'집현전')),O('국방에 쓴다','군사력 +10%',E=>E.mod('JOSEON',{army:.1}),false,4)],{cond:E=>E.has('JOSEON')});
add(1433,1,1,'JOSEON','兵','4군 6진 개척','최윤덕이 압록강 유역에 4군을, 김종서가 두만강 유역에 6진을 설치했다. 오늘날 국경선의 기틀.',

add(1441,8,1,'JOSEON','學','측우기와 자격루','장영실이 측우기를 만들었다. 세계 최초로 강수량을 정량 측정한 기록이다.',[H('관측한다','연구 진척 +30%',E=>E.mod('JOSEON',{res:.3}))],{cond:E=>E.has('JOSEON')&&E.fig('jangyeongsil')});
add(1443,12,1,'JOSEON','文','훈민정음 창제','세종이 스물여덟 글자를 만들었다. 최만리 등은 "중국을 섬기는 도리가 아니다"라며 상소를 올렸다. 1446년 반포.',

add(1440,1,1,'HRE','學','구텐베르크의 인쇄기','마인츠의 금세공인이 금속 활자와 압착기를 결합했다. 50년 안에 유럽에 2000만 권의 책이 찍힌다.',

add(1453,5,29,'OTTOMAN','戰','콘스탄티노폴리스 함락','메흐메트 2세가 거대한 우르반 대포로 테오도시우스 성벽을 무너뜨렸다. 1000년의 동로마가 끝났다.',

add(1453,10,10,'JOSEON','政','계유정난','수양대군이 김종서와 황보인을 죽이고 권력을 잡았다.',[H('정난 (역사)','안정도 -1, 군주 교체',E=>E.mod('JOSEON',{stab:-1})),O('단종을 지킨다','안정도 -0.5 (역사 개변 +8)',E=>E.mod('JOSEON',{stab:-.5}),false,8)],{cond:E=>E.has('JOSEON')});
add(1453,10,19,'ENGLAND','戰','백년 전쟁의 끝','잉글랜드가 칼레를 제외한 대륙의 영토를 모두 잃었다. 2년 뒤 장미 전쟁이 시작된다.',[H('물러난다','안정도 -1',E=>{E.mod('ENGLAND',{stab:-1});E.give('ENGLAND','FRANCE',[-5,43,8,51]);})],{cond:E=>E.has('ENGLAND')&&E.has('FRANCE')});
add(1479,1,20,'CASTILE','政','스페인의 탄생','카스티야의 이사벨과 아라곤의 페르난도가 공동으로 다스리게 되었다.',[H('통합','아라곤 병합, 스페인으로',E=>{E.annexTo('CASTILE','ARAGON');E.retag('CASTILE','SPAIN','스페인');})],{maj:1,cond:E=>E.has('CASTILE')&&E.has('ARAGON')});
add(1480,1,1,'MUSCOVY','政','타타르의 멍에에서 벗어나다','우그라 강의 대치 끝에 이반 3세가 금장 칸국에 대한 공납을 끊었다.',[H('독립','금장 칸국 일부 흡수',E=>{E.conquer('MUSCOVY','GOLDENHORDE',{share:.35});E.conquer('MUSCOVY','NOVGOROD',{share:1});})],{maj:1,cond:E=>E.has('MUSCOVY')});
add(1492,1,2,'SPAIN','戰','그라나다 함락 — 레콘키스타 완료','이베리아 반도의 마지막 이슬람 왕국이 항복했다.',[H('함락','그라나다 병합',E=>E.conquer('SPAIN','GRANADA',{share:1}))],{maj:1,cond:E=>E.has('SPAIN')&&E.has('GRANADA')});
add(1492,10,12,'SPAIN','通','콜럼버스, 신대륙에 닿다','산타마리아 호가 바하마의 과나아니 섬에 닿았다. 콜럼버스는 죽을 때까지 그곳을 인도라고 믿었다.',

add(1494,1,1,'JOSEON','政','연산군의 폭정과 사화','무오사화와 갑자사화로 사림이 피를 흘렸다. 1506년 중종반정으로 연산군이 쫓겨난다.',[H('사화','안정도 -1.5',E=>E.mod('JOSEON',{stab:-1.5})),O('사림을 보호한다','국고 -0.3년치 (역사 개변 +6)',E=>E.mod('JOSEON',{gold:-.3}),false,6)],{cond:E=>E.has('JOSEON')});
add(1498,5,20,'PORTUGAL','通','바스쿠 다 가마의 인도 항로','희망봉을 돌아 인도 캘리컷에 닿았다. 향신료 무역의 판도가 바뀐다.',[H('항로를 연다','원양 항해 습득, 해안 거점',E=>{E.tech('PORTUGAL','navig');E.claimFree('PORTUGAL',[-18,-35,50,16],.08);})],{maj:1,cond:E=>E.has('PORTUGAL')});
add(1500,4,22,'PORTUGAL','通','브라질 발견','카브랄의 함대가 남아메리카 동해안에 닿았다.',[H('식민한다','브라질 해안 개척',E=>E.claimFree('PORTUGAL',[-55,-30,-34,-2],.6))],{cond:E=>E.has('PORTUGAL')});
add(1501,1,1,null,'政','사파비 왕조','열네 살의 이스마일이 타브리즈에서 샤를 칭했다. 이란에 시아파 국가가 선다.',

add(1517,1,1,'OTTOMAN','戰','맘루크 정복','셀림 1세가 카이로를 함락했다. 오스만이 메카와 메디나의 수호자가 된다.',[H('정복','맘루크 병합',E=>E.conquer('OTTOMAN','MAMLUK',{share:1,boost:1.8}))],{maj:1,cond:E=>E.has('OTTOMAN')&&E.has('MAMLUK')});
add(1517,10,31,'HRE','文','종교 개혁','비텐베르크 성당 문에 95개조 반박문이 붙었다.',

add(1521,8,13,'SPAIN','戰','아즈텍의 멸망','코르테스가 600명의 병사와 수만 명의 원주민 동맹군으로 테노치티틀란을 함락했다. 천연두가 먼저 도시를 휩쓸었다.',

add(1520,1,1,null,'災','콜럼버스의 교환 — 천연두','구대륙의 병원균이 아메리카에 퍼졌다. 한 세기 동안 원주민의 80~90%가 죽는다.',[H('','아메리카 인구 -70%',E=>E.plague([-170,-56,-30,72],.7))],{maj:1});
add(1526,4,21,null,'戰','무굴 제국','티무르의 후손 바부르가 파니파트에서 로디 왕조를 무너뜨렸다.',

add(1533,7,26,'SPAIN','戰','잉카의 멸망','피사로가 아타우알파를 처형했다.',[H('정복','잉카 병합, 남미 서부 개척',E=>{E.conquer('SPAIN','INCA',{share:1,boost:3});E.conquer('SPAIN','CHIMU',{share:1,boost:3});E.claimFree('SPAIN',[-82,-40,-62,10],.5);})],{maj:1,cond:E=>E.has('SPAIN')&&E.has('INCA')});
add(1547,1,16,'MUSCOVY','政','차르 이반 4세','이반 뇌제가 차르로 즉위했다. 카잔과 아스트라한을 정복하고 시베리아로 나아간다.',

add(1565,1,23,'VIJAYANAGARA','戰','탈리코타 전투','데칸 술탄국 연합군이 비자야나가르의 수도 함피를 파괴했다.',[H('패배','안정도 -3, 영토 상실',E=>{E.mod('VIJAYANAGARA',{stab:-3});E.conquer('BAHMANI','VIJAYANAGARA',{share:.5});})],{cond:E=>E.has('VIJAYANAGARA')});
add(1582,1,1,'RUSSIA','通','시베리아 정복','카자크 예르마크가 시베리아 칸국을 무너뜨렸다. 60년 만에 러시아는 태평양에 닿는다.',[H('동쪽으로','시베리아 개척',E=>{E.claimFree('RUSSIA',[55,48,180,78],.85);})],{maj:1,cond:E=>E.has('RUSSIA')});
add(1583,1,1,'JOSEON','兵','십만양병설','율곡 이이가 "10년 안에 큰 화가 닥칠 것"이라며 10만 군사를 길러야 한다고 했다고 전한다. 조정은 받아들이지 않았다.',

add(1590,8,1,'MUROMACHI','政','도요토미 히데요시의 천하 통일','오다와라의 호조 가문이 항복하며 전국 시대가 끝났다. 히데요시는 이제 명 정벌을 꿈꾼다.',

add(1810,9,16,'SPAIN','政','라틴 아메리카 독립 전쟁','이달고 신부의 "돌로레스의 외침"을 시작으로, 볼리바르와 산마르틴이 남미를 해방한다.',

add(1840,6,1,'QING','戰','아편 전쟁','영국 함대가 광저우를 봉쇄했다. 2년 뒤 난징 조약으로 홍콩을 내준다.',

add(1850,12,1,'QING','戰','태평천국 운동','홍수전이 "천국"을 세우고 난징을 수도로 삼았다. 14년간 2000만 명이 죽는다.',[H('진압','안정도 -3, 인구 -6%',E=>E.mod('QING',{stab:-3,pop:-.06}))],{maj:1,cond:E=>E.has('QING')});
add(1853,7,8,'JAPAN','外','페리 내항','미국의 검은 배 네 척이 우라가 앞바다에 나타났다.',

add(1861,1,1,'JOSEON','學','대동여지도','김정호가 22첩의 목판 지도를 완성했다. 10리마다 눈금을 찍었다.',[H('간행','개척 속도 +10%, 세수 +3%',E=>{E.tmod('JOSEON','colon',.1,60,'대동여지도');E.tmod('JOSEON','tax',.03,60,'대동여지도');})],{cond:E=>E.has('JOSEON')&&E.fig('kimjeongho')});
add(1863,12,1,'JOSEON','政','흥선대원군의 집권','열두 살 고종이 즉위하고 아버지 흥선대원군이 실권을 잡았다. 서원을 철폐하고 경복궁을 다시 짓는다.',

add(1866,10,1,'JOSEON','戰','병인양요','천주교 탄압을 구실로 프랑스 함대가 강화도를 침공했다. 양헌수가 정족산성에서 물리쳤다.',[H('물리친다','안정도 +0.5',E=>E.mod('JOSEON',{stab:.5}))],{cond:E=>E.has('JOSEON')});
add(1868,1,3,'JAPAN','政','메이지 유신','막부가 무너지고 천황 중심의 근대 국가가 세워졌다. 화혼양재, 부국강병.',

add(1871,6,1,'JOSEON','戰','신미양요와 척화비','미국 함대가 강화도 광성보를 함락했다. 대원군은 전국에 척화비를 세웠다. "서양 오랑캐가 침범하는데 싸우지 않으면 화친하는 것이요, 화친을 주장함은 나라를 파는 것이다."',

add(1871,1,18,'GERMANCONF','政','독일 제국 선포','베르사유 궁전 거울의 방에서 빌헬름 1세가 독일 황제로 즉위했다.',[H('통일','독일 제국, 프랑스 안정도 -2',E=>{E.retag('GERMANCONF','GERMANY','독일 제국',{gov:'constmon',col:'#555555'});E.mod('FRANCE',{stab:-2});E.conquerNear('GERMANY',[7,48.5],100,{from:'FRANCE',peaceful:1});})],{maj:1,cond:E=>E.has('GERMANCONF')});
add(1876,2,27,'JAPAN','外','강화도 조약','운요호 사건을 구실로 일본이 조선에 불평등 조약을 강요했다. 부산·원산·인천이 열린다.',

add(1882,7,23,'JOSEON','戰','임오군란','13개월 치 급료를 받지 못한 구식 군인들이 들고일어났다. 청군이 들어와 대원군을 압송해 간다.',

add(1884,12,4,'JOSEON','政','갑신정변','김옥균·박영효·서재필 등 급진 개화파가 우정국 개국 축하연에서 정변을 일으켰다. 삼일천하.',

add(1894,2,15,'JOSEON','戰','동학 농민 운동','고부 군수 조병갑의 학정에 전봉준이 일어났다. "제폭구민, 보국안민." 농민군이 전주성을 점령한다.',

add(1894,7,25,'JAPAN','戰','청일 전쟁','풍도 앞바다에서 일본 해군이 청 함대를 기습했다. 평양과 황해에서 청군이 무너진다.',

add(1894,7,27,'JOSEON','政','갑오개혁','군국기무처가 신분제와 과거제를 없애고, 노비제를 폐지했다.',

add(1897,10,12,'JOSEON','政','대한제국 선포','러시아 공사관에서 돌아온 고종이 환구단에서 황제에 즉위했다. 연호는 광무.',

add(1905,11,17,'JAPAN','外','을사늑약','이토 히로부미가 군대를 이끌고 덕수궁 중명전에 들어왔다. 외교권을 빼앗는 조약이 강요된다. 장지연은 "시일야방성대곡"을 썼다.',

add(1953,7,27,'ROK','外','정전 협정','판문점에서 정전 협정이 조인되었다. 휴전선이 그어지고, 한반도는 다시 둘로 남았다. 3년 동안 수백만 명이 죽거나 다쳤다.',

add(1973,1,12,'ROK','工','중화학공업화 선언','포항제철이 첫 쇳물을 쏟았다. 철강·조선·기계·전자·화학에 국가 자원을 몰아준다.',[H('선언한다','「중화학공업 육성」 채택, 강철·대량 생산 진척',E=>{E.pol('ROK','heavychem');E.tech('ROK','steel',1);E.mod('ROK',{res:.3});}),O('경공업 수출에 머문다','안정도 +0.5',E=>E.mod('ROK',{stab:.5}),false,6)],{cond:E=>E.has('ROK')});

add(1980,5,18,'ROK','政','5·18 광주 민주화운동','계엄 확대에 맞선 광주 시민들을 공수부대가 진압했다. 열흘 동안 수백 명이 죽었다.',[H('비극','안정도 -2',E=>E.mod('ROK',{stab:-2}))],{maj:1,cond:E=>E.has('ROK')});

function interp(tab, y){ if(y<=tab[0][0]) return tab[0][1]; for(let i=1;i<tab.length;i++){ if(y<=tab[i][0]){ const [x0,v0]=tab[i-1],[x1,v1]=tab[i]; return v0+(v1-v0)*(y-x0)/(x1-x0); } } return tab[tab.length-1][1]; }
function interpLog(tab,y){ if(y<=tab[0][0]) return tab[0][1]; for(let i=1;i<tab.length;i++){ if(y<=tab[i][0]){ const [x0,v0]=tab[i-1],[x1,v1]=tab[i]; return Math.exp(Math.log(v0)+(Math.log(v1)-Math.log(v0))*(y-x0)/(x1-x0)); } } return tab[tab.length-1][1]; }

// srcs: [{ci, prov, r, box}] ; allow(prov, ci) → bool
function claimMulti(G, srcs, allow, maxSea){
  const best = new Float32Array(N).fill(1e9), who = new Int32Array(N).fill(-1);
  const heap=[]; const push=(d,p,ci,r,box)=>{ heap.push([d,p,ci,r,box]); let i=heap.length-1; while(i>0){const pa=(i-1)>>1; if(heap[pa][0]<=heap[i][0])break; [heap[pa],heap[i]]=[heap[i],heap[pa]]; i=pa;} };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let i=0; for(;;){ const l=2*i+1,r=l+1; let m=i; if(l<heap.length&&heap[l][0]<heap[m][0])m=l; if(r<heap.length&&heap[r][0]<heap[m][0])m=r; if(m===i)break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } } return top; };
  for(const s of srcs) if(s.prov>=0) push(0,s.prov,s.ci,s.r,s.box);
  const out=[];
  while(heap.length){
    const [d,p,ci,r,box]=pop();
    if(who[p]>=0 || d>r) continue;
    if(box && !inBox(p,box)) continue;
    if(!allow(p,ci)) continue;
    who[p]=ci; out.push([p,ci]);
    for(const q of ADJ[p]) if(who[q]<0){ const nd=d+pdist(p,q); if(nd<best[q]&&nd<=r){ best[q]=nd; push(nd,q,ci,r,box);} }
    if(maxSea) for(const q of SEA[p]) if(who[q]<0){ const nd=d+pdist(p,q)*1.6; if(nd<best[q]&&nd<=r){ best[q]=nd; push(nd,q,ci,r,box);} }
  }
  return out;
}

    for(const [lo,la,r] of anchors){ const p=nearestProv(lo,la,400); if(p>=0) srcs.push({ci:c.i,prov:p,r:Math.max(r,1),box:opt.box}); }

  const res = claimMulti(G, srcs, ()=>true, true);
  for(const [p,ci] of res) G.owner[p]=ci;
  for(const c of G.C){ const p=nearestProv(c.capAnchor[0],c.capAnchor[1],400); c.cap = (p>=0&&G.owner[p]===c.i)?p:-1; }
  // 인구 (시작 시점 세계 인구가 실제 통계와 같도록 보정)
  G.kscale=1; let ks=0; for(let p=0;p<N;p++) ks+=Kprov(G,p);

ENG.EVS = EVS;

function has(G,tag){ const i=G.tag[tag]; return i!==undefined && G.C[i].alive; }

// ── 인구 부양력 ──
function techFactor(G,c){ const k=G.y<1750?0.045:G.y<1900?0.025:0.012; return clamp(Math.exp(k*(c.techs.size - expectedTech(G.y))), 0.18, 3.5); }
function Kprov(G,p){
  const o=G.owner[p]; const real=interpLog(D.STATS.worldPop, G.y);

ENG.climF=climF;
function headroom(y){ return interp([[-5000,1.15],[1750,1.15],[1850,1.35],[1920,1.8],[1960,2.4],[2100,2.4]],y); }
// ── 효과 합산 ──
const FXKEYS=['tax','prod','mil','def','res','lit','life','stab','colon','naval','demo','manp','tfr','growth'];
function techFx(c){ const s={}; FXKEYS.forEach(k=>s[k]=0); let gdp=650; for(const id of c.techs){ const t=TECHS[id]; for(const k in t.fx) s[k]+=t.fx[k]; gdp*=1+D.ERA_GDP_G[t.era]; } s.gdpBase=gdp; return s; }
function mods(G,c){

  const s={}; FXKEYS.forEach(k=>s[k]=c.fx[k]);
  const add=(fx)=>{ for(const k in fx) if(k in s) s[k]+=fx[k]; };
  add(D.GOVS[c.gov].fx);

  for(const t of c.tmods) if(t.until>G.day) s[t.k]=(s[t.k]||0)+t.v;

ENG.mods = mods;

function recalc(G,c){

  let rw=0; for(let p=0;p<N;p++) if(G.owner[p]===c.i){ pop+=G.pop[p]; n++; area+=PAREA[p]; if(PCOAST[p]) coast++; for(const r of PRES[p]) rc[r]=(rc[r]||0)+1; if(G.road) rw+=G.pop[p]*G.road[p]; }
  c.pop=pop; c.prov=n; c.area=area; c.coast=coast; c.resCnt=rc; c.roadAvg=pop>0?rw/pop:0;
  const s=mods(G,c); c.m=s; s.prod+=0.015*c.roadAvg; s.tax+=0.01*c.roadAvg;
  // 자원 부족 (우리 땅과 이웃 어디에도 없을 때)

ENG.recalc=recalc;

function autoPolicies(G,c){

  // 고유 제도 우선

    if(p.req && !c.techs.has(p.req) && !(D.GOVS[p.req]&&c.gov===p.req)) { if(!(p.req==='chief'&&['chief','monarchy','empire','central','feudal','theocracy','aristo','absolut'].includes(c.gov))&&!(p.req==='monarchy'&&c.gov!=='tribe')) return false; }

}
ENG.availablePolicies=availablePolicies;
function availableGovs(G,c){ return Object.keys(D.GOVS).filter(id=>id!=='exile'&&(!D.GOVS[id].req||c.techs.has(D.GOVS[id].req))); }
ENG.availableGovs=availableGovs;

// ── 연구 ──
function techCost(G,c,id){

  let m = D.ERA_COST[t.era];

function availableTechs(c){ return TL.filter(t=>!c.techs.has(t.id) && t.req.every(r=>c.techs.has(r))).map(t=>t.id); }

// ── 군주 ──
const NAMEPOOL = D.NAMES;
function genRuler(G,c){
  const r=(a)=>a[Math.floor(rng(G)*a.length)];
  let name;
  const cul=c.cul;
  if(c.kr){
    if(['republic','junta','socialist'].includes(c.gov)) name=r(NAMEPOOL.kr)+r(NAMEPOOL.krGiven)+r(NAMEPOOL.krGiven);
    else name=r(NAMEPOOL.krTemple)+(['central','absolut','constmon','empire'].includes(c.gov)?(rng(G)<.5?'종':'조'):'왕');
  } else if(cul==='cn') name=r(NAMEPOOL.cn)+r(NAMEPOOL.cnGiven);

function mortality(age, le){ const shift=Math.max(0,(le-30))*0.55; return clamp(0.006*Math.exp(0.085*(age-30-shift)),0.002,0.6); }

// ── 기록 ──

// ── 소유권 이전 ──

  if(ci>=0){ const c=G.C[ci]; if(c.cap<0) c.cap=p; if(c.exile){ c.exile=false; if(c.gov==='exile') c.gov='republic'; } }
}

}
function checkDeaths(G){
  const cnt=new Int32Array(G.C.length); for(let p=0;p<N;p++) if(G.owner[p]>=0) cnt[G.owner[p]]++;

    if(cnt[c.i]===0 && !c.exile){ c.alive=false; G.wars=G.wars.filter(w=>w.a!==c.i&&w.b!==c.i); if(G.armies) G.armies=G.armies.filter(a=>a.o!==c.i); if(G.battles) G.battles=G.battles.filter(b=>b.ao!==c.i&&b.do!==c.i);
      if(c.i===G.player){ G.gameOver={reason:'fall', y:G.y}; }
      else news(G,`${c.name} 멸망`,'亡'); } }
}

// ── 기후·재해 ──

ENG.realTemp=realTemp;
function coolSum(G){ let s=0; for(const c of (G.cools||[])) if(c.until>G.day) s+=c.dT; return s; }
function computeTemp(G){
  let base;

  else { const b0=realTemp(1850); const ratio=G.ceR>0?clamp(G.ce/G.ceR,0,3):1; base=b0+(realTemp(G.y)-b0)*ratio; }
  G.tempBase=base; G.temp=base+coolSum(G);
}
ENG.computeTemp=computeTemp;
function yearlyEmissions(G){
  if(G.y<1850) return;
  const realWorld=interpLog(D.STATS.worldPop,G.y)*interp(D.STATS.worldGdp,G.y);
  let tot=0,fos=0; for(const c of G.C){ if(!c.alive) continue; tot+=c.gdp; const k=id=>c.techs.has(id); const sh=!k('steam')?0.05:k('carbon')?0.2:k('renew')?0.65:1; fos+=c.gdp*sh; }

}
function addCool(G,dT,years,label){ (G.cools=G.cools||[]).push({dT,until:G.day+Math.round(years*365),label}); G.cools=G.cools.filter(c=>c.until>G.day); computeTemp(G); }

  let deaths=0; const owners=new Map();
  for(let p=0;p<N;p++){ const d=pdist(p,p0); if(p!==p0&&d>r) continue;
    const o=G.owner[p]; const c=o>=0?G.C[o]:null;
    const resil = c&&c.techs.has('steel')&&c.eff>0.7 ? 0.35 : c&&c.techs.has('masonry')?1:0.7;
    let k = share!=null ? (p===p0?share:share*0.25*(1-d/r)) : 0.0006*Math.pow(3,M-7)*(p===p0?1:0.25*(1-d/r)) * (G.y<1900?1.5:1);
    k=clamp(k*resil,0,0.6); const lost=G.pop[p]*k; G.pop[p]-=lost; deaths+=lost;
    if(o>=0) owners.set(o,(owners.get(o)||0)+lost);
  }

  logDisaster(G,{t:'지진',name,M,deaths,p:p0});
  for(const [o,l] of owners){ const c=G.C[o]; if(l>c.pop*0.002){ c.stab=clamp(c.stab-Math.min(1,l/c.pop*30),-3,3); c.tmods.push({k:'prod',v:-Math.min(0.15,l/c.pop*5),until:G.day+365,label:name}); } }

function erupt(G,vname,vei){

  const p0=VPROV[vi]; const r=40*Math.pow(2,vei-4);

  if(p0>=0) for(let p=0;p<N;p++){ const d=pdist(p,p0); if(p!==p0&&d>r) continue; const c_=G.owner[p]>=0?G.C[G.owner[p]]:null; const k=clamp(0.002*Math.pow(2,vei-4)*(p===p0?3:(1-d/r))*(c_&&c_.techs.has('radio')?0.4:1),0,0.5); const lost=G.pop[p]*k; G.pop[p]-=lost; deaths+=lost; const o=G.owner[p]; if(o>=0) owners.set(o,(owners.get(o)||0)+lost); }
  const cool={5:[-0.08,1],6:[-0.35,2],7:[-0.8,3],8:[-2,6]}[vei];
  if(cool){ addCool(G,cool[0],cool[1],`${v[0]} 분화`); if(cool[0]<=-0.35) ENG.api(G).plague([-180,35,180,72],0.015*Math.abs(cool[0])/0.35); }

function natureMonth(G){

  D.SEISMIC.forEach(([nm,b,rate],k)=>{ if(rng(G)<rate/12){ const ps=[]; for(let p=0;p<N;p++) if(PSEISZ[p]===k) ps.push(p); if(!ps.length) return; const p=ps[Math.floor(rng(G)*ps.length)];
    const sub=['일본 해구','순다·필리핀 해구','안데스','알래스카·알류샨','캄차카','멕시코·중앙아메리카'].includes(nm); const M = nm.startsWith('한반도') ? 5+rng(G)*1.6 : Math.min(sub?9.3:8.2,7-Math.log(1-rng(G))*(sub?0.45:0.3)); quake(G,PLON[p],PLAT[p],M,null); } });

// ── 엔진 API (사건 스크립트용) ──
function api(G){

    has:t=>has(G,t), isP:t=>{ const i=G.tag[t]; return i!==undefined&&i===G.player&&G.C[i].alive; }, c:t=>C(G,t),
    rnd:()=>rng(G),
    str:t=>{ const c=C(G,t); return c&&c.alive?c.str*(1+c.m.def*0.5):0; },

    tfr:t=>{ const c=C(G,t); return c?c.tfr:2; },

    ruler:t=>{ const c=C(G,t); if(!c) return null; if(!c.ruler){ const h=histRuler(G,c); return h?h[0]:null; } return c.ruler.name; },
    fig:id=>{ const s=G.figs[id]; const f=D.FIGS.find(x=>x.id===id); return !!(s&&s.st==='alive'&&f&&G.y>=f.a[0]-1&&G.y<=f.a[1]+1); },

    flag:(t,f)=>{ const c=C(G,t); if(c) c.flags[f]=1; }, hf:(t,f)=>{ const c=C(G,t); return !!(c&&c.alive&&c.flags[f]); },
    krTag:()=>{ const P=G.C[G.player]; if(P.kr&&P.alive&&['KOREMP','JOSEON','KPG','ROK','DPRK','GORYEO'].includes(P.tag)) return P.tag; for(const t of ['KOREMP','JOSEON','KPG','ROK']) if(has(G,t)) return t; return null; },
    isExile:t=>{ const c=C(G,t); return !!(c&&c.alive&&c.exile); },
    coastal:t=>{ const c=C(G,t); return c&&c.coast>0; },
    neighbors:t=>neighbors(G,C(G,t)).map(i=>G.C[i].tag),
    weakestNeighbor:t=>{ const c=C(G,t); const ns=neighbors(G,c); if(!ns.length) return null; ns.sort((a,b)=>G.C[a].str-G.C[b].str); return G.C[ns[0]].tag; },
    atWar:(a,b)=>{ const x=C(G,a),y=C(G,b); return !!(x&&y&&findWar(G,x.i,y.i)); },
    provsIn:(t,box)=>{ const c=C(G,t); if(!c||!c.alive) return 0; let n=0; for(let p=0;p<N;p++) if(G.owner[p]===c.i&&inBox(p,box)) n++; return n; },
    news:s=>news(G,s),

      if(o.stab) c.stab=clamp(c.stab+o.stab,-3,3);

      if(o.pop) for(let p=0;p<N;p++) if(G.owner[p]===c.i) G.pop[p]*=Math.max(0,1+o.pop);
      if(o.lit) c.perm.lit+=o.lit; if(o.life) c.perm.life+=o.life; if(o.def) c.perm.def+=o.def;

    },
    tmod:(t,k,v,yrs,label)=>{ const c=C(G,t); if(!c) return; c.tmods.push({k,v,until:G.day+Math.round(yrs*365),label:label||''}); },
    tech:(t,id)=>{ const c=C(G,t); if(c&&c.alive) grantTech(G,c,id); },
    gov:(t,id)=>{ const c=C(G,t); if(!c) return; c.gov=id; c.slots=D.GOVS[id].slots; while(c.policies.length>c.slots) c.policies.pop(); if(c.i!==G.player) autoPolicies(G,c); },
    pol:(t,id)=>{ const c=C(G,t); if(!c||!c.alive||c.policies.includes(id)) return; if(c.policies.length>=D.GOVS[c.gov].slots) c.policies.shift(); c.policies.push(id); },
    unpol:(t,id)=>{ const c=C(G,t); if(c) c.policies=c.policies.filter(x=>x!==id); },
    rename:(t,name)=>{ const c=C(G,t); if(c){ news(G,`${c.name} → ${name}`,'名'); c.name=name; } },
    retag:(o,n,name,opt)=>{ const c=C(G,o); if(!c||!c.alive) return; opt=opt||{}; if(n!==o){ delete G.tag[o]; G.tag[n]=c.i; c.tag=n; }
      if(name&&name!==c.name){ news(G,`${c.name} → ${name}`,'名'); c.name=name; } if(opt.gov){ E.gov(n,opt.gov); } if(opt.col) c.col=opt.col; if(c.i===G.player){ c.ruler=null; ensureRuler(G,c); } G.ownVer++; },
    capital:(t,ll)=>{ const c=C(G,t); if(!c) return; const p=nearestProv(ll[0],ll[1],200); if(p>=0&&G.owner[p]===c.i) c.cap=p; },
    spawn:(tag,name,anchors,opt)=>spawn(G,E,tag,name,anchors,opt||{}),
    claimFree:(t,box,frac)=>{ const c=C(G,t); if(!c||!c.alive) return; const ps=[]; for(let p=0;p<N;p++) if(G.owner[p]<0&&inBox(p,box)) ps.push(p);
      const ref=c.cap>=0?c.cap:ps[0]; ps.sort((a,b)=>pdist(a,ref)-pdist(b,ref)); const k=Math.round(ps.length*(frac==null?1:frac)); for(let i=0;i<k;i++) setOwner(G,ps[i],c.i); },
    give:(f,t,box)=>{ const a=C(G,f),b=C(G,t); if(!a||!b||!a.alive) return; if(!b.alive){ b.alive=true; } for(let p=0;p<N;p++) if(G.owner[p]===a.i&&inBox(p,box)) setOwner(G,p,b.i); checkDeaths(G); },
    conquer:(att,def,o)=>conquer(G,E,att,def,o||{}),
    conquerNear:(att,ll,km,o)=>{ o=o||{}; const a=C(G,att); if(!a||!a.alive) return; const p0=nearestProv(ll[0],ll[1],400); if(p0<0) return;

      for(const p of targets) if(o.peaceful||G.owner[p]!==G.player) setOwner(G,p,a.i);

    war:(a,b,o)=>{ const x=C(G,a),y=C(G,b); if(x&&y&&x.alive&&y.alive&&x!==y) declareWar(G,x.i,y.i,o&&o.boost); },
    peace:(a,b)=>{ const x=C(G,a),y=C(G,b); if(x&&y) makePeace(G,x.i,y.i,true); },
    peaceAll:(t)=>{ const c=C(G,t); if(c) for(const w of [...G.wars]) if(w.a===c.i||w.b===c.i) makePeace(G,w.a,w.b,true); },
    plague:(box,pct,sp,spct)=>{ const spc=sp?C(G,sp):null; for(let p=0;p<N;p++) if(inBox(p,box)){ const own=G.owner[p]; const k=(spc&&own===spc.i)?spct:pct; G.pop[p]*=1-k*(0.6+0.8*rng(G)); } },
    annexTo:(into,from)=>{ const a=C(G,into),b=C(G,from); if(!a||!b||!a.alive||!b.alive) return; for(let p=0;p<N;p++) if(G.owner[p]===b.i) setOwner(G,p,a.i);

    exile:(t,to)=>{ const c=C(G,t),d=C(G,to); if(!c) return; for(let p=0;p<N;p++) if(G.owner[p]===c.i) setOwner(G,p,d?d.i:-1); c.exile=true; c.gov='exile'; G.armies=G.armies.filter(a=>a.o!==c.i); c.soldiers=c.soldiers*0.05; G.wars=G.wars.filter(w=>w.a!==c.i&&w.b!==c.i);

ENG.api=api;

function spawn(G,E,tag,name,anchors,opt){
  if(has(G,tag)) return C(G,tag);
  let from = opt.from||'any';
  const fromIdx = Array.isArray(from)? new Set(from.filter(t=>t!=='free').map(t=>G.tag[t]).filter(x=>x!==undefined)) : null;
  const allowFree = from==='any'||from==='free'||(Array.isArray(from)&&from.includes('free'));
  const takeP = !!E.ctx.takeP;
  const allow=(p)=>{ const o=G.owner[p]; if(o<0) return allowFree; if(o===G.player&&!takeP) return false; if(from==='free') return false; if(from==='any') return true; return fromIdx.has(o); };
  // 기존 국가 객체 재사용 (같은 태그로 부활)
  let c = C(G,tag);
  if(c){ c.alive=true; c.name=name; c.exile=false; }
  else c = newCountry(G,tag,name,{gov:opt.gov,kr:opt.kr,cul:opt.cul,col:opt.col});
  c.gov=opt.gov||c.gov;
  const srcs=[]; for(const [lo,la,r] of anchors){ const p=nearestProv(lo,la,400); if(p>=0) srcs.push({ci:c.i,prov:p,r,box:opt.box}); }
  const res=claimMulti(G,srcs,(p)=>allow(p),true);
  if(!res.length){ c.alive=false; return null; }
  const losers=new Set();
  for(const [p] of res){ if(G.owner[p]>=0) losers.add(G.owner[p]); setOwner(G,p,c.i); }
  // 기술: 부모 또는 원 소유자의 기술 계승
  const parent = opt.techsFrom? C(G,opt.techsFrom) : (losers.size? G.C[[...losers][0]] : null);
  if(parent) for(const id of parent.techs) c.techs.add(id); else giveInitialTechs(G,c,G.y,300);
  c.techDirty=true; if(parent){ c.eff=parent.eff*0.9; c.tfrS=parent.tfrS; c.leS=parent.leS; c.inst=clamp(parent.inst+(rng(G)-.6)*0.25,0.35,1.15); }
  recalc(G,c); c.soldiers=c.pop*0.012*(opt.army||1); c.gold=c.income*0.4; c.stab=1; autoPolicies(G,c);
  const p0=nearestProv(anchors[0][0],anchors[0][1],400); c.cap=(p0>=0&&G.owner[p0]===c.i)?p0:res[0][0];
  resetArmies(G,c);
  for(let p=0;p<N;p++) if(G.owner[p]===c.i) G.road[p]=Math.min(G.road[p],roadMax(c));
  checkDeaths(G); fixCapitals(G);
  if(losers.has(G.player)) chron(G,`${name}의 독립`,`${name}이(가) 우리 영토 일부에서 일어섰다.`,'裂');
  news(G,`${name} 등장`,'興');
  return c;
}
function conquer(G,E,att,def,o){
  const a=C(G,att), d=C(G,def); if(!a||!d||!a.alive||!d.alive||a===d) return;
  if(d.i===G.player || a.i===G.player){ declareWar(G,a.i,d.i,o.boost); return; }
  let ps=[]; for(let p=0;p<N;p++) if(G.owner[p]===d.i && (!o.box||inBox(p,o.box))) ps.push(p);
  if(o.share!=null && !o.box){ const ref=a.cap>=0?a.cap:ps[0]; ps.sort((x,y)=>pdist(x,ref)-pdist(y,ref)); ps=ps.slice(0,Math.round(ps.length*o.share)); }
  for(const p of ps){ setOwner(G,p,a.i); G.pop[p]*=0.93; }
  if(ps.length) news(G,`${a.name}, ${d.name}의 영토 ${ps.length}곳 장악`,'戰');
  checkDeaths(G); fixCapitals(G);

// ── 이웃 ──
function neighbors(G,c){
  if(!c) return [];
  const s=new Set(); const nav=c.m?c.m.naval:0;
  for(let p=0;p<N;p++) if(G.owner[p]===c.i){ for(const q of ADJ[p]){ const o=G.owner[q]; if(o>=0&&o!==c.i) s.add(o);} if(nav>=1) for(const q of SEA[p]){ const o=G.owner[q]; if(o>=0&&o!==c.i) s.add(o);} }
  return [...s];
