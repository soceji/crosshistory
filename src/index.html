<title>역사의 갈림길</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 지도가 화면의 주인공, 오른쪽에 국정 패널, 위에 연표 막대. 밤의 지도첩 — 먹빛 바다, 한지빛 글자, 금빛 영토, 붉은 낙관 */
:root{
  --ink:#0d1318; --ocean:#13222c; --panel:#121a20; --panel2:#18222a; --line:#28353f; --line2:#34434e;
  --fg:#ebe5d6; --fg2:#c3bcac; --muted:#8a949b; --gold:#d6a94f; --gold2:#f0cf86; --seal:#c4452f; --seal2:#e0664f;
  --good:#79b48a; --warn:#d9a441; --bad:#d5604e;
  --f-display:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disl{height:142px;overflow:hidden}
.cur .row{flex-wrap:nowrap;white-space:nowrap;gap:8px}
.cur .row>*{overflow:hidden;text-overflow:ellipsis}
.learn{margin:12px 0 4px;border:1px solid #33404a;border-radius:6px;background:#10171c;overflow:hidden}
.learn .ph{position:relative;height:220px;overflow:hidden;background:#0b1014;display:grid;place-items:center;color:var(--muted);font-size:12.5px}
.learn .ph .imgw{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.learn .ph .imgw img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.learn .ph .ld{padding:0 16px;text-align:center}
.learn .cap{display:flex;justify-content:space-between;gap:8px;padding:6px 12px;font-size:11.5px;color:var(--muted);border-top:1px solid #222c33}
.learn .cap a{color:var(--muted)}
.learn .nt{padding:10px 12px 0;font-size:13.5px;line-height:1.7;color:var(--fg2)}
.learn details{padding:8px 12px 10px}
.learn summary{cursor:pointer;color:var(--gold2);font-size:13px;font-weight:600}
.learn details p{font-size:13.5px;line-height:1.75;margin:8px 0 0;color:var(--fg)}
.learn .lk{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--gold2)}
.lbtn{font-size:11.5px;color:var(--gold2);border:1px solid #4b3d22;border-radius:4px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.lbtn:hover{background:#2a2414}
#learnv .evt{width:min(720px,100%)}
#learnv .learn .ph{height:min(46vh,420px)}
#learnv{position:relative;z-index:30}
.tcur{height:146px;box-sizing:border-box;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:3em;line-height:1.5}
.epil{margin-top:6px;height:86px;overflow-y:auto}
.dn{display:inline-block;text-align:right;white-space:nowrap}
.serif{font-family:var(--f-display)}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ── 앱 골격 ── */
#app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
#top{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:linear-gradient(#111a20,#0e161b);flex-wrap:wrap;min-width:0}
#main{display:grid;grid-template-columns:1fr 410px;min-height:0}
#mapwrap{position:relative;min-width:0;min-height:0;background:var(--ocean);overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#map.drag{cursor:grabbing}
#side{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#ticker{border-top:1px solid var(--line);background:#0b1115;height:30px;overflow:hidden;white-space:nowrap;font-size:12.5px;display:flex;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:22px;color:var(--fg2)}
#ticker .tk{display:inline-flex;gap:6px;align-items:center}
#ticker .tk b{font-family:var(--f-body);color:var(--seal2);font-weight:600;font-size:11px;border:1px solid #4e2a24;border-radius:3px;padding:0 4px}
#ticker .tk .y{font-family:var(--f-mono);color:var(--muted)}

/* 국가 칩 */
.realm{display:flex;align-items:center;gap:10px;min-width:0}
.realm .flag{width:30px;height:30px;border-radius:4px;border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25);flex:none}
.realm .nm{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.realm .gv{font-size:11.5px;color:var(--muted);white-space:nowrap}

/* 날짜와 속도 */
.clock{display:flex;align-items:center;gap:10px}
.date{font-family:var(--f-display);font-weight:700;font-size:19px;width:190px;text-align:left;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.speeds{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.speeds button{padding:4px 8px;font-family:var(--f-mono);font-size:12px;color:var(--fg2);border-right:1px solid var(--line)}
.speeds button:last-child{border-right:0}
.speeds button.on{background:var(--gold);color:#1a1408;font-weight:500}
.speeds button.pause.on{background:var(--seal);color:#fff}
.ff{padding:4px 10px;border:1px solid var(--line2);border-radius:6px;font-size:12px;color:var(--fg2)}
.ff:hover,.speeds button:hover{background:rgba(255,255,255,.06)}

.stats{display:flex;gap:0;margin-left:auto;flex-wrap:nowrap;min-width:0}
.sec{display:block}
.pill{display:flex;flex-direction:column;padding:2px 9px;border-left:1px solid var(--line);min-width:0;flex:none;overflow:hidden}
.pill .k{font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.pill .v{font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .v small{font-size:11px;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.menu-btn{padding:6px 10px;border:1px solid var(--line2);border-radius:6px;font-size:12.5px}

/* 지도 위 컨트롤 */
.mapctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.mapctl button{background:rgba(13,19,24,.85);border:1px solid var(--line2);border-radius:5px;padding:4px 10px;font-size:12px;color:var(--fg2);backdrop-filter:blur(4px)}
.mapctl button.on{color:var(--gold2);border-color:var(--gold)}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoomctl button{width:30px;height:30px;background:rgba(13,19,24,.85);border:1px solid var(--line2);border-radius:5px;font-size:16px}
.legend{position:absolute;right:12px;bottom:12px;background:rgba(13,19,24,.85);border:1px solid var(--line2);border-radius:6px;padding:6px 10px;font-size:11.5px;color:var(--fg2);z-index:2;max-width:260px}
.res-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;height:28px;box-sizing:border-box;white-space:nowrap}
.res-row>*{overflow:hidden;text-overflow:ellipsis}
.res-row>.g{overflow:visible}
.res-row .g{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:11px;color:#0d1318;flex:none}
.res-row .g.off{background:#283036!important;border:1px solid currentColor}
.legend .ramp{height:8px;border-radius:2px;margin:4px 0 2px;width:180px}
.legend .ends{display:flex;justify-content:space-between;width:180px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

/* 지방 카드 */
#pcard{position:absolute;left:12px;bottom:12px;width:300px;max-width:calc(100% - 24px);background:rgba(16,23,29,.96);border:1px solid var(--line2);border-radius:8px;padding:12px 14px;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#pcard h3{margin:0;font-family:var(--f-display);font-size:17px;text-wrap:balance}
#pcard .own{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg2);margin:2px 0 8px}
#pcard .own i{width:10px;height:10px;border-radius:2px;display:inline-block}
#pcard dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 10px;font-size:12.5px}
#pcard dt{color:var(--muted)} #pcard dd{margin:0;font-family:var(--f-mono);text-align:right}
#pcard .acts{display:flex;flex-direction:column;gap:6px}
#pcard .x{position:absolute;right:8px;top:6px;color:var(--muted);font-size:18px;padding:2px 6px}
.btn{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);font-size:13px;text-align:left}
.btn:hover:not(:disabled){border-color:var(--gold);background:#1d2932}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn small{color:var(--muted);font-family:var(--f-mono);font-size:11.5px;white-space:nowrap}
.btn.war{border-color:#5a2c26}.btn.war:hover:not(:disabled){border-color:var(--seal2);background:#2a1916}
.btn.gold{background:var(--gold);color:#1b1407;border-color:var(--gold);font-weight:600;justify-content:center}
.btn.gold:hover:not(:disabled){background:var(--gold2)}

/* 패널 탭 */
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{flex:1;padding:10px 6px 9px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--gold)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--seal2);margin-left:4px;vertical-align:middle}
.pane{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 16px 24px;min-height:0}
.pane h4{font-family:var(--f-display);font-size:14px;margin:18px 0 8px;color:var(--fg);letter-spacing:.02em;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.pane h4>span:first-child{white-space:nowrap}
.pane h4:first-child{margin-top:0}
.pane h4 .s{font-family:var(--f-body);font-size:11.5px;color:var(--muted);font-weight:400}
.sub{font-size:12px;color:var(--muted)}

/* 지도자 카드 */
.ruler{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.seal{width:44px;height:44px;flex:none;border-radius:4px;background:var(--seal);color:#fbeee6;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;line-height:1.05;text-align:center;word-break:keep-all;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),inset 0 0 0 4px var(--seal)}
.ruler .nm{font-family:var(--f-display);font-weight:700;font-size:16px}
.ruler .st{display:flex;gap:10px;font-size:12px;color:var(--fg2)}
.ruler .st b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}

/* 통계 표 (실제 역사 비교) */
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th{font-weight:500;color:var(--muted);text-align:right;font-size:11px;letter-spacing:.04em;padding:0 0 4px}
.cmp th:first-child{text-align:left}
.cmp td{padding:5px 0;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cmp td:first-child{text-align:left;font-family:var(--f-body);color:var(--fg2)}
.cmp td.r{color:var(--muted)}
.factline{font-size:12.5px;color:var(--fg2);border-left:2px solid var(--gold);padding:4px 0 4px 10px;margin:10px 0}

.row{display:flex;gap:10px;align-items:center}
.slider{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.slider input{width:100%;accent-color:var(--gold)}
.slider .row{justify-content:space-between;font-size:12.5px;white-space:nowrap}

/* 차트 */
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .lg{display:flex;gap:14px;font-size:11.5px;color:var(--fg2);margin-bottom:4px;flex-wrap:wrap}
.chart .lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.chart .lg i.d{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)!important}
.tip{position:absolute;pointer-events:none;background:#0b1115;border:1px solid var(--line2);border-radius:5px;padding:5px 8px;font-size:11.5px;white-space:nowrap;z-index:5}
.tip b{font-family:var(--f-mono);font-weight:500}

/* 기술 */
.focus{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border:1px solid var(--line2);border-radius:999px;font-size:12px;color:var(--fg2)}
.chip.on{border-color:var(--gold);color:var(--gold2);background:rgba(214,169,79,.08)}
.cur{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.bar{height:6px;background:#0b1115;border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:3px}
.treewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:8px;max-height:56vh;background:#0f171c;position:relative}
.tree{position:relative}
.tree svg{position:absolute;left:0;top:0;pointer-events:none}
.tn{position:absolute;width:128px;height:34px;border-radius:5px;border:1px solid var(--line2);background:#141e25;font-size:11.5px;line-height:1.15;padding:3px 6px;text-align:left;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.tn small{font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.tn.known{background:#2a2617;border-color:#5d4c22;color:var(--gold2)}
.tn.avail{border-color:var(--gold);color:var(--fg)}
.tn.avail:hover{background:#1f2b33}
.tn.locked{color:#66717a}
.tn.cur{box-shadow:0 0 0 2px var(--gold2);background:linear-gradient(90deg,rgba(214,169,79,.35) var(--p),#141e25 var(--p))}
.eh{position:absolute;top:6px;font-family:var(--f-display);font-size:12px;color:var(--muted);letter-spacing:.08em}
.ch{position:absolute;left:6px;font-family:var(--f-display);font-size:16px;color:#3c4a54}

/* 정책 */
.pol{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:var(--panel2)}
.pol .hn{grid-column:1/-1}
.hn{margin-top:6px}
.hn summary{cursor:pointer;font-size:12px;color:var(--gold2);list-style-position:inside}
.hn p{font-size:12.5px;line-height:1.7;color:var(--fg2);margin:6px 0}
.hn .hl{padding:8px 0;border-top:1px solid var(--line)}
.hn .hl p{margin:4px 0}
.hn .hl .fx{font-size:11.5px;font-family:var(--f-mono);color:var(--muted)}
.pol.on{border-color:var(--gold);background:#211e15}
.pol .t{font-weight:600;font-size:13px}
.pol .t .kr{font-size:10.5px;color:var(--seal2);border:1px solid #6b2e24;border-radius:3px;padding:0 4px;margin-left:6px;font-weight:500}
.pol .d{grid-column:1;font-size:12px;color:var(--muted)}
.pol .fx{grid-column:1;font-size:11.5px;font-family:var(--f-mono);color:var(--fg2)}
.pol button{grid-column:2;grid-row:1/4;align-self:center;padding:5px 10px;border:1px solid var(--line2);border-radius:5px;font-size:12px}
.pol.on button{border-color:var(--gold);color:var(--gold2)}
.slots{display:flex;gap:4px}
.slots i{width:18px;height:6px;border-radius:2px;background:var(--line2)}
.slots i.f{background:var(--gold)}
select{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);border-radius:6px;padding:6px 8px;font:inherit;font-size:13px;max-width:100%}

/* 외교 */
.war{border:1px solid #4e2a24;background:#1c1513;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.war .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.war .h b{font-family:var(--f-display)}
.war .meter{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:8px 0 4px;background:#0b1115}
.war .meter i{display:block;height:100%}
.nb{display:grid;grid-template-columns:12px minmax(0,1fr) 78px auto;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12.5px}
.nb i{width:10px;height:10px;border-radius:2px}
.nb .r{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.nb button{padding:3px 8px;border:1px solid #5a2c26;border-radius:5px;font-size:11.5px;color:var(--seal2)}
.nb button:disabled{opacity:.4}

/* 인물 */
.fig{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.fig .seal{grid-row:1/3}
.fig.dim .seal{background:#3a3f44;box-shadow:none;color:#9aa3a9}
.fig .n{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fig .n small{font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.fig .x{font-size:12.5px;color:var(--fg2)}
.badge{font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--fg2);font-family:var(--f-body)}
.badge.act{border-color:var(--gold);color:var(--gold2)}
.badge.dead{color:var(--muted)}

/* 연대기 */
.chron{list-style:none;margin:0;padding:0}
.chron li{display:grid;grid-template-columns:38px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.chron .g{width:38px;height:26px;border-radius:3px;background:#2a1a17;color:var(--seal2);display:grid;place-items:center;font-family:var(--f-body);font-weight:600;font-size:11px;border:1px solid #4e2a24}
.chron .y{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.chron .t{font-family:var(--f-display);font-weight:700;font-size:14px}
.chron .x{font-size:12.5px;color:var(--fg2);margin-top:2px}

/* ── 사건 모달 (EU 풍) ── */
.ovl{position:fixed;inset:0;background:rgba(5,8,10,.62);display:grid;place-items:center;z-index:20;padding:16px;backdrop-filter:blur(2px)}
.evt{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;background:#141b20;border:1px solid #4b3d22;border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 0 4px #10161a,inset 0 0 0 5px #3a3020;animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.evt{animation:none}}
.evt .hd{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:18px 22px 14px;border-bottom:1px solid #2e3a42;background:linear-gradient(180deg,#1c2329,#141b20)}
.evt .hd .seal{width:58px;height:58px;font-size:18px}
.evt .when{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.evt h2{font-family:var(--f-display);font-weight:900;font-size:24px;margin:2px 0 0;line-height:1.25;text-wrap:balance}
.evt .who{font-size:12.5px;color:var(--gold2);margin-top:2px}
.evt .body{padding:16px 22px 6px;font-size:14.5px;line-height:1.75;color:var(--fg);max-width:65ch}
.evt .opts{display:flex;flex-direction:column;gap:8px;padding:12px 22px 20px}
.opt{display:block;text-align:left;padding:10px 14px;border:1px solid #4b3d22;border-radius:5px;background:#1b1f1e}
.opt:hover{background:#262418;border-color:var(--gold)}
.opt .l{font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.opt .l .h{font-size:10.5px;font-weight:500;color:#1b1407;background:var(--gold);border-radius:3px;padding:0 5px}
.opt .tp{font-size:12px;color:var(--fg2);margin-top:2px}
.opt .dv{font-size:11.5px;color:var(--seal2)}

/* ── 시작 화면 ── */
#start{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);background:var(--ink)}
#start .l{padding:36px max(24px,env(safe-area-inset-left,0px)) 28px 40px;overflow:auto;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line)}
#start .brand{display:flex;gap:16px;align-items:center}
#start .brand .seal{width:64px;height:64px;font-size:20px;line-height:1}
#start h1{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.1;margin:0;letter-spacing:-.01em}
#start .lead{color:var(--fg2);font-size:14.5px;max-width:58ch;margin:0}
.eras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.era{padding:10px 12px;border:1px solid var(--line2);border-radius:7px;text-align:left;background:var(--panel2)}
.era .y{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.era .n{font-family:var(--f-display);font-weight:700;font-size:16px}
.era.on{border-color:var(--gold);background:#211e15}
.era.on .n{color:var(--gold2)}
.eradesc{font-size:13px;color:var(--fg2);border-left:2px solid var(--seal);padding:2px 0 2px 12px;margin:0}
.clist{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:260px;padding-right:4px}
.ci{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border:1px solid transparent;border-radius:6px;text-align:left}
.ci:hover{background:var(--panel2)}
.ci.on{border-color:var(--gold);background:#211e15}
.ci i{width:12px;height:12px;border-radius:2px}
.ci .p{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ci .kr{font-size:10.5px;color:var(--seal2);margin-left:6px}
.cdesc{font-size:12.5px;color:var(--fg2);min-height:2.5em;margin:0}
#start .r{position:relative;background:var(--ocean);min-width:0}
#start .r canvas{position:absolute;inset:0;width:100%;height:100%}
#start .r .cap{position:absolute;left:18px;bottom:16px;right:18px;font-size:12px;color:var(--muted)}
.startbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.startbar .btn{flex:1;min-width:140px;justify-content:center}

/* 결말 */
.final{width:min(760px,100%);max-height:calc(100% - 20px);overflow:auto;background:#141b20;border:1px solid #4b3d22;border-radius:6px;padding:28px 30px}
.final h2{font-family:var(--f-display);font-weight:900;font-size:30px;margin:4px 0 10px;text-wrap:balance}
.final .big{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.final .big>div{border-top:2px solid var(--gold);padding-top:8px}
.final .big .v{font-family:var(--f-mono);font-size:22px}
.final .big .k{font-size:12px;color:var(--muted)}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto;margin:12px 0}

.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#1d262d;border:1px solid var(--line2);padding:8px 14px;border-radius:6px;font-size:13px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu{position:absolute;right:16px;top:52px;background:#141b20;border:1px solid var(--line2);border-radius:8px;padding:6px;z-index:25;display:flex;flex-direction:column;min-width:180px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{text-align:left;padding:8px 10px;border-radius:5px;font-size:13px}
.menu button:hover{background:var(--panel2)}

/* ── 좁은 화면 ── */
@media (max-width:1500px){ .stats .pill .k{font-size:10px} .pill .v{font-size:12.5px} .ff{padding:4px 8px} }
@media (max-width:980px){
  #main{grid-template-columns:1fr;grid-template-rows:minmax(260px,52%) 1fr}
  #side{border-left:0;border-top:1px solid var(--line)}
  .stats{margin-left:0;width:100%}
  .pill{min-width:0;flex:1 1 30%;width:auto!important}
  .stats{flex-wrap:wrap}
  .date{min-width:0;font-size:17px}
  #start{display:flex;flex-direction:column;overflow:auto}
  #start .l{padding:20px 16px 24px;border-right:0;overflow:visible;flex:none}
  #start .r{order:-1;flex:none;height:210px;border-bottom:1px solid var(--line)}
  #start .r .cap{display:none}
  .eras{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clist{max-height:220px}
}
@media (max-width:560px){
  #top{gap:6px 8px;padding-top:6px;padding-bottom:6px}
  .realm{flex:1}
  .realm .flag{width:24px;height:24px}
  .clock{width:100%;gap:6px;order:3}
  .date{font-size:14.5px;min-width:0;text-align:left;flex:none}
  .speeds{overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .speeds button{padding:4px 6px;flex:none}
  .ff{padding:4px 7px;white-space:nowrap;font-size:11.5px}
  .stats{order:4;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px 0}
  .pill{padding:1px 6px}
  .pill .v{font-size:12px;overflow:hidden;text-overflow:ellipsis}
  .pill .v small{display:none}
  .menu-btn{padding:4px 8px}
  #main{grid-template-rows:minmax(240px,48%) 1fr}
  .realm .nm{font-size:15px;max-width:150px}
  #start h1{font-size:30px}
  .final .big{grid-template-columns:1fr 1fr}
  .speeds button{padding:4px 6px}
  .evt h2{font-size:20px}
  .evt .hd,.evt .body,.evt .opts{padding-left:16px;padding-right:16px}
}
</style>
